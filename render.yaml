services:
  - type: web
    name: flavorfind
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SPOONACULAR_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
